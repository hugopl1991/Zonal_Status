# ─────────────────────────────────────────────────────────────────────────────
# Análise Zonal – Estoque de Carbono (Vale)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Zonal_shp.py ──────────────────────────────────────────────────────────
  zonal:
    build:
      context: .
      dockerfile: Dockerfile
    image: carbono-geo:latest
    container_name: zonal_shp
    command: python scripts/Zonal_shp.py
    volumes:
      - ${DIR_SUPRIMIDAS}:/dados
      - ${DIR_MASCARA_PAI}:/mascara_dir
    environment:
      - DIR_RAIZ=/dados
      - SHP_MASCARA=/mascara_dir/Compilado.shp
    restart: "no"

  # ── Prodes_gpkg.py ────────────────────────────────────────────────────────
  prodes:
    image: carbono-geo:latest   # reutiliza a imagem buildada pelo serviço 'zonal'
    container_name: prodes_gpkg
    command: python scripts/Prodes_gpkg.py
    volumes:
      - ${DIR_SUPRIMIDAS}:/dados
      - ${DIR_MASCARA_PAI}:/mascara_dir
    environment:
      - DIR_RAIZ=/dados
      - SHP_MASCARA=/mascara_dir/Compilado.shp
    restart: "no"
    depends_on:
      - zonal